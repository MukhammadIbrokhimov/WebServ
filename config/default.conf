server {
    listen 8080;
    server_name localhost;
    root ./www;
    client_max_body_size 10M;

    location / {
        allowed_methods GET POST DELETE;
        index index.html;
        autoindex off;
    }

    location /upload {
        allowed_methods POST DELETE;
        upload_store ./www/uploads;
    }

    location /cgi-bin {
        allowed_methods GET POST;
        cgi .py /usr/bin/python3;
    }

    include error.conf;
}
